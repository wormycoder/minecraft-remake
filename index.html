<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; overflow: hidden; background: #000; }
        canvas { display: block; }

        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-size: 20px; text-align: center;
            z-index: 100;
        }

        #errorBox {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            background: #c0392b; color: white;
            padding: 15px 25px; border-radius: 6px;
            font-family: monospace; font-size: 13px;
            max-width: 80%; z-index: 200; display: none;
            white-space: pre-wrap;
        }

        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #fff; font-size: 14px; z-index: 10;
            background: rgba(0,0,0,0.7); padding: 15px 20px;
            border-radius: 4px; display: none;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px;
            transform: translate(-50%, -50%);
            z-index: 5; pointer-events: none;
        }
        #crosshair svg { width: 100%; height: 100%; }

        #controls {
            position: absolute; bottom: 20px; left: 20px;
            color: #aaa; font-size: 12px;
            background: rgba(0,0,0,0.7); padding: 15px 20px;
            border-radius: 4px; display: none;
        }

        #blockSelector {
            position: absolute; bottom: 20px; right: 20px;
            display: none; gap: 10px; z-index: 10;
        }

        .blockButton {
            width: 50px; height: 50px;
            border: 2px solid #555; border-radius: 4px;
            cursor: pointer; transition: all 0.2s;
            background-size: cover; background-color: #666;
        }
        .blockButton:hover { border-color: #fff; }
        .blockButton.active { border-color: #0f0; box-shadow: 0 0 10px #0f0; }
    </style>
</head>
<body>
    <div id="loading">Loading world...</div>
    <div id="errorBox"></div>
    <div id="crosshair">
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="1" fill="white" opacity="0.7"/>
            <line x1="10" y1="4" x2="10" y2="6" stroke="white" stroke-width="0.5" opacity="0.7"/>
            <line x1="10" y1="14" x2="10" y2="16" stroke="white" stroke-width="0.5" opacity="0.7"/>
            <line x1="4" y1="10" x2="6" y2="10" stroke="white" stroke-width="0.5" opacity="0.7"/>
            <line x1="14" y1="10" x2="16" y2="10" stroke="white" stroke-width="0.5" opacity="0.7"/>
        </svg>
    </div>
    <div id="ui">
        <div>X: <span id="posX">0</span></div>
        <div>Y: <span id="posY">0</span></div>
        <div>Z: <span id="posZ">0</span></div>
        <div>FPS: <span id="fps">0</span></div>
    </div>
    <div id="controls">
        <div><strong>WASD</strong> - Move</div>
        <div><strong>Space</strong> - Jump</div>
        <div><strong>Left Click</strong> - Break Block</div>
        <div><strong>Right Click</strong> - Place Block</div>
        <div><strong>Click canvas</strong> - Lock mouse look</div>
    </div>
    <div id="blockSelector">
        <button class="blockButton active" data-type="grass" title="Grass"></button>
        <button class="blockButton" data-type="stone" title="Stone"></button>
        <button class="blockButton" data-type="dirt" style="background-color:#8B7355;" title="Dirt"></button>
        <button class="blockButton" data-type="wood" style="background-color:#8B4513;" title="Wood"></button>
    </div>

    <!-- On-screen error catcher so problems are visible without devtools -->
    <script>
        window.addEventListener('error', function (e) {
            var box = document.getElementById('errorBox');
            box.style.display = 'block';
            box.textContent = 'Error: ' + e.message + '\n(line ' + e.lineno + ', col ' + e.colno + ')';
            var loading = document.getElementById('loading');
            if (loading) loading.textContent = 'Something went wrong — see error above.';
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

bufferView":3,"componentType":5123,"count":36,"max":[23],"min":[0],"type":"SCALAR"}],"materials":[{"pbrMetallicRoughness":{"metallicFactor":0,"roughnessFactor":1,"baseColorTexture":{"index":0}},"alphaMode":"MASK","alphaCutoff":0.05}],"textures":[{"sampler":0,"source":0,"name":"stone block"}],"samplers":[{"magFilter":9728,"minFilter":9728,"wrapS":33071,"wrapT":33071}],"images":[{"mimeType":"image/png","uri":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAACx0lEQVR4AeyY243rMAxEc1NCykoNqTNlpYW7OAZoEFqRNiXKGxsKMJDEx5AcKT++P5/P/0fh9Xpt1iJGsKevW+fv3pkfTn88HjeNkuDz+dwExJX+7POhAshges0eKMr3SwBU92AVqOVYsXvtCLU3tjXulwAU9aAH1UVrOdqfsad2Bo/mWASAGIiDPZCzXvWg2t67L+uVZ+G37OKProsADEUi5IAzwJYJuEEr54ieFgFoCHIB5xEQfkQALTXgaMmzclYBrIARdoYAHjf+VpE83tLnCkADHkoyOZMj+29fXQG4BQ/WcOQggsCK+wa7K0BPg4ggQIgerpG5wwTQTSOEPu/d1/KyxbxDCPY2dbW4u6jsiYDPghaEGH0etc+ss/wFtkTAb6EckuYEpc87w+/5xUcckHN0LeMXATBCCti3gnyNVp4j81YBjiz6TbVWAXi2exojDuyJ7Ykpa3Au0cMvuasAGHQBzjXIE6/5MmzSQ8kldfVaxrScVwE0MfsImTS9tW5xkk9twVZ8hn8VoIdMGt5aqcGQGtgE5Mv+qDVFgEizDKkRyR0Rawqgb6m2H9EMdUbwepymAPqWanuPNOpjcEAdKxe/5euxmwK0kpaNchZYnAwOLD/5lq/Xni5A2RCDCVoHkfySO+OcLgDNWoPiy2g6kyNdAJr7xkHpq4b1ewC3BmpB2C3U4qM2i9uyR/m9+OV7ADcmqAWLr7bW4qO2Gq9ni/J78UP+AlKwdoPiO2rdqpMqgAwsRWu3SIz4Wd/v978ewNGDVAFkYK8hYjz/0b57j/oZuUcPXNZLfQEl+RnOU4Az3NLIHucLGKnuGbjnCzjDLY3scb6AkeqegXu+gDPc0sge5wsYqe5fcEdrzhcQVexq8fMFXO1Go/PMFxBV7Grx8wVc7Uaj88wXEFXsavHzBVztRqPzzBcQVexq8fMFnP1Ge/v/AQAA//+S8ogHAAAABklEQVQDADqzf58m+9gOAAAAAElFTkSuQmCC"}],"meshes":[{"primitives":[{"mode":4,"attributes":{"POSITION":0,"NORMAL":1,"TEXCOORD_0":2},"indices":3,"material":0}]}]};

        var scene, camera, renderer;
        var blocks = new Map();
        var selectedBlock = 'grass';
        var keys = {};
        var velocity = new THREE.Vector3();
        var isGrounded = false;
        var yaw = 0, pitch = 0;
        var lastFrameTime = Date.now();
        var frameCount = 0;

        var COLORS = { dirt: 0x8B7355, wood: 0x8B4513 };
        var templates = {}; // filled with {geometry, material} for grass/stone once loaded

        function showFatal(msg) {
            var box = document.getElementById('errorBox');
            box.style.display = 'block';
            box.textContent = 'Error: ' + msg;
            document.getElementById('loading').textContent = 'Something went wrong — see error above.';
        }

        function loadTemplate(gltfJson, name, callback) {
            try {
                var loader = new THREE.GLTFLoader();
                loader.parse(JSON.stringify(gltfJson), '', function (gltf) {
                    var found = null;
                    gltf.scene.traverse(function (child) {
                        if (!found && child.isMesh) found = child;
                    });
                    if (!found) {
                        showFatal('No mesh found inside ' + name + ' model.');
                        callback(null);
                        return;
                    }
                    templates[name] = { geometry: found.geometry, material: found.material };
                    callback(true);
                }, function (err) {
                    showFatal('Failed to parse ' + name + ' model: ' + err);
                    callback(null);
                });
            } catch (e) {
                showFatal('Exception loading ' + name + ' model: ' + e.message);
                callback(null);
            }
        }

        function init() {
            try {
                if (typeof THREE === 'undefined') {
                    showFatal('Three.js failed to load (check internet connection).');
                    return;
                }
                if (typeof THREE.GLTFLoader === 'undefined') {
                    showFatal('GLTFLoader failed to load (check internet connection).');
                    return;
                }

                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87CEEB);
                scene.fog = new THREE.Fog(0x87CEEB, 200, 500);

                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 70, 0);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.shadowMap.enabled = true;
                document.body.appendChild(renderer.domElement);

                var ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);

                var sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
                sunLight.position.set(100, 100, 50);
                sunLight.castShadow = true;
                scene.add(sunLight);

                document.addEventListener('keydown', onKeyDown);
                document.addEventListener('keyup', onKeyUp);
                document.addEventListener('mousedown', onMouseDown);
                document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
                window.addEventListener('resize', onWindowResize);
                document.addEventListener('mousemove', onMouseMove);

                document.querySelectorAll('.blockButton').forEach(function (btn) {
                    btn.addEventListener('click', function (e) {
                        document.querySelectorAll('.blockButton').forEach(function (b) { b.classList.remove('active'); });
                        e.currentTarget.classList.add('active');
                        selectedBlock = e.currentTarget.dataset.type;
                    });
                });

                renderer.domElement.addEventListener('click', function () {
                    var el = renderer.domElement;
                    var request = el.requestPointerLock || el.mozRequestPointerLock;
                    if (request) request.call(el);
                });

                // Load both custom block models, then start the world
                var remaining = 2;
                function onOneLoaded() {
                    remaining--;
                    if (remaining === 0) startWorld();
                }
                loadTemplate(GRASS_GLTF, 'grass', onOneLoaded);
                loadTemplate(STONE_GLTF, 'stone', onOneLoaded);

            } catch (e) {
                showFatal('Init failed: ' + e.message);
            }
        }

        function startWorld() {
            document.getElementById('ui').style.display = 'block';
            document.getElementById('controls').style.display = 'block';
            document.getElementById('blockSelector').style.display = 'flex';
            document.getElementById('loading').style.display = 'none';

            generateTerrain();
            animate();
        }

        function generateTerrain() {
            var range = 30;
            for (var x = -range; x < range; x++) {
                for (var z = -range; z < range; z++) {
                    var height = Math.floor(
                        Math.sin(x * 0.05) * 8 +
                        Math.cos(z * 0.05) * 8 +
                        Math.sin(x * 0.02 + z * 0.02) * 4 +
                        50
                    );
                    for (var y = 0; y <= height; y++) {
                        var blockType = 'stone';
                        if (y === height) blockType = 'grass';
                        else if (y > height - 3) blockType = 'dirt';
                        addBlock(x, y, z, blockType);
                    }
                }
            }
        }

        function makeMesh(type) {
            if (templates[type]) {
                // Share geometry/material across instances for performance
                return new THREE.Mesh(templates[type].geometry, templates[type].material);
            }
            var geometry = new THREE.BoxGeometry(1, 1, 1);
            var material = new THREE.MeshPhongMaterial({ color: COLORS[type] || 0xffffff });
            return new THREE.Mesh(geometry, material);
        }

        function addBlock(x, y, z, type) {
            var key = x + ',' + y + ',' + z;
            if (blocks.has(key)) return;

            var mesh = makeMesh(type);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            scene.add(mesh);
            blocks.set(key, { mesh: mesh, type: type, x: x, y: y, z: z });
        }

        function removeBlock(x, y, z) {
            var key = x + ',' + y + ',' + z;
            var block = blocks.get(key);
            if (block) {
                scene.remove(block.mesh);
                blocks.delete(key);
            }
        }

        function raycast() {
            var raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            var meshes = [];
            blocks.forEach(function (b) { meshes.push(b.mesh); });
            var intersects = raycaster.intersectObjects(meshes);
            return intersects.length > 0 ? intersects[0] : null;
        }

        function onKeyDown(e) { keys[e.key] = true; }
        function onKeyUp(e) { keys[e.key] = false; }

        function onMouseMove(e) {
            if (document.pointerLockElement !== renderer.domElement) return;
            var sensitivity = 0.003;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
        }

        function onMouseDown(e) {
            var intersection = raycast();
            if (!intersection) return;

            if (e.button === 0) {
                var pos = intersection.object.position;
                removeBlock(pos.x, pos.y, pos.z);
            } else if (e.button === 2) {
                var normal = intersection.face.normal;
                var newX = Math.round(intersection.point.x + normal.x * 0.5);
                var newY = Math.round(intersection.point.y + normal.y * 0.5);
                var newZ = Math.round(intersection.point.z + normal.z * 0.5);
                addBlock(newX, newY, newZ, selectedBlock);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function update() {
            var now = Date.now();
            var deltaTime = Math.min((now - lastFrameTime) / 1000, 0.1);
            lastFrameTime = now;

            frameCount++;
            if (frameCount % 30 === 0) {
                document.getElementById('fps').textContent = Math.round(1 / deltaTime);
            }

            var moveDir = new THREE.Vector3();
            var moveSpeed = 0.2;

            if (keys['w'] || keys['W']) moveDir.z -= 1;
            if (keys['s'] || keys['S']) moveDir.z += 1;
            if (keys['a'] || keys['A']) moveDir.x -= 1;
            if (keys['d'] || keys['D']) moveDir.x += 1;

            if (moveDir.length() > 0) {
                moveDir.normalize();
                var forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                var right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                velocity.x = (forward.x * moveDir.z + right.x * moveDir.x) * moveSpeed;
                velocity.z = (forward.z * moveDir.z + right.z * moveDir.x) * moveSpeed;
            } else {
                velocity.x *= 0.85;
                velocity.z *= 0.85;
            }

            if ((keys[' '] || keys['Spacebar']) && isGrounded) {
                velocity.y = 0.35;
                isGrounded = false;
            }

            velocity.y -= 0.02;
            velocity.y = Math.max(velocity.y, -0.5);

            camera.position.add(velocity);

            var playerY = camera.position.y - 1.6;
            var blockKey = Math.round(camera.position.x) + ',' + Math.floor(playerY) + ',' + Math.round(camera.position.z);
            var groundBlock = blocks.get(blockKey);

            isGrounded = !!groundBlock;
            if (groundBlock) {
                velocity.y = 0;
                camera.position.y = Math.max(camera.position.y, groundBlock.y + 2.6);
            }

            document.getElementById('posX').textContent = Math.round(camera.position.x);
            document.getElementById('posY').textContent = Math.round(camera.position.y);
            document.getElementById('posZ').textContent = Math.round(camera.position.z);

            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        function animate() {
            requestAnimationFrame(animate);
            try {
                update();
                renderer.render(scene, camera);
            } catch (e) {
                showFatal('Runtime error: ' + e.message);
            }
        }

        window.addEventListener('load', init);
        setTimeout(function () { if (!scene) init(); }, 2000);
    })();
    </script>
</body>
</html>
