<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; overflow: hidden; background: #000; }
        canvas { display: block; }

        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-size: 20px; text-align: center;
            z-index: 100;
        }

        #errorBox {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            background: #c0392b; color: white;
            padding: 15px 25px; border-radius: 6px;
            font-family: monospace; font-size: 13px;
            max-width: 80%; z-index: 200; display: none;
            white-space: pre-wrap;
        }

        #ui {
            position: absolute; top: 20px; left: 20px;
            color: #fff; font-size: 14px; z-index: 10;
            background: rgba(0,0,0,0.7); padding: 15px 20px;
            border-radius: 4px; display: none;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px;
            transform: translate(-50%, -50%);
            z-index: 5; pointer-events: none;
        }
        #crosshair svg { width: 100%; height: 100%; }

        #controls {
            position: absolute; bottom: 20px; left: 20px;
            color: #aaa; font-size: 12px;
            background: rgba(0,0,0,0.7); padding: 15px 20px;
            border-radius: 4px; display: none;
        }

        #blockSelector {
            position: absolute; bottom: 20px; right: 20px;
            display: none; gap: 10px; z-index: 10;
        }

        .blockButton {
            width: 50px; height: 50px;
            border: 2px solid #555; border-radius: 4px;
            cursor: pointer; transition: all 0.2s;
            background-color: #666;
        }
        .blockButton:hover { border-color: #fff; }
        .blockButton.active { border-color: #0f0; box-shadow: 0 0 10px #0f0; }
    </style>
</head>
<body>
    <div id="loading">Loading world...</div>
    <div id="errorBox"></div>
    <div id="crosshair">
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="1" fill="white" opacity="0.7"/>
            <line x1="10" y1="4" x2="10" y2="6" stroke="white" stroke-width="0.5" opacity="0.7"/>
            <line x1="10" y1="14" x2="10" y2="16" stroke="white" stroke-width="0.5" opacity="0.7"/>
            <line x1="4" y1="10" x2="6" y2="10" stroke="white" stroke-width="0.5" opacity="0.7"/>
            <line x1="14" y1="10" x2="16" y2="10" stroke="white" stroke-width="0.5" opacity="0.7"/>
        </svg>
    </div>
    <div id="ui">
        <div>X: <span id="posX">0</span></div>
        <div>Y: <span id="posY">0</span></div>
        <div>Z: <span id="posZ">0</span></div>
        <div>Chunk: <span id="chunkPos">0,0</span></div>
        <div>FPS: <span id="fps">0</span></div>
    </div>
    <div id="controls">
        <div><strong>WASD</strong> - Move</div>
        <div><strong>Space</strong> - Jump</div>
        <div><strong>Left Click</strong> - Break Block</div>
        <div><strong>Right Click</strong> - Place Block</div>
        <div><strong>Click canvas</strong> - Lock mouse look</div>
    </div>
    <div id="blockSelector">
        <button class="blockButton active" data-type="grass" title="Grass"></button>
        <button class="blockButton" data-type="stone" title="Stone"></button>
        <button class="blockButton" data-type="dirt" style="background-color:#8B7355;" title="Dirt"></button>
        <button class="blockButton" data-type="wood" style="background-color:#8B4513;" title="Wood"></button>
    </div>

    <script>
        window.addEventListener('error', function (e) {
            var box = document.getElementById('errorBox');
            box.style.display = 'block';
            box.textContent = 'Error: ' + e.message + '\n(line ' + e.lineno + ', col ' + e.colno + ')';
            var loading = document.getElementById('loading');
            if (loading) loading.textContent = 'Something went wrong — see error above.';
        });
    </script>

        var templates = {};       // {grass:{geometry,material}, stone:{...}, dirt:{...}, wood:{...}}
        var chunks = new Map();   // key "cx,cz" -> {cx,cz, exposed: Map(key->type), meshes:{type:Mesh}}
        var overrides = new Map(); // key "x,y,z" -> 'empty' or type  (only player-modified cells)

        function showFatal(msg) {
            var box = document.getElementById('errorBox');

        // ===================== PERLIN NOISE =====================
        var perm = new Uint8Array(512);
        (function seedPerlin() {
            var p = new Uint8Array(256);
            for (var i = 0; i < 256; i++) p[i] = i;
            var seed = 98765;
            function rand() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
            for (var i2 = 255; i2 > 0; i2--) {
                var j = Math.floor(rand() * (i2 + 1));
                var tmp = p[i2]; p[i2] = p[j]; p[j] = tmp;
            }
            for (var i3 = 0; i3 < 512; i3++) perm[i3] = p[i3 & 255];
        })();
        function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        function lerp(t, a, b) { return a + t * (b - a); }
        function grad(hash, x, y) {
            var h = hash & 3;
            var u = h < 2 ? x : y;
            var v = h < 2 ? y : x;
            return ((h & 1) ? -u : u) + ((h & 2) ? -2 * v : 2 * v);
        }
        function perlin2(x, y) {
            var X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
            x -= Math.floor(x); y -= Math.floor(y);
            var u = fade(x), v = fade(y);
            var aa = perm[perm[X] + Y], ab = perm[perm[X] + Y + 1];
            var ba = perm[perm[X + 1] + Y], bb = perm[perm[X + 1] + Y + 1];
            return lerp(v, lerp(u, grad(aa, x, y), grad(ba, x - 1, y)),
                           lerp(u, grad(ab, x, y - 1), grad(bb, x - 1, y - 1)));
        }

            var total = 0, amp = 1, freq = 1, maxAmp = 0;
            for (var i = 0; i < octaves; i++) {
                total += perlin2(x * freq, y * freq) * amp;
                maxAmp += amp;
                amp *= 0.5;
                freq *= 2;
            }
            return total / maxAmp; // roughly -1..1
        }
        function terrainHeight(x, z) {
            var e = fbm(x * 0.015, z * 0.015, 4);
            return Math.floor(40 + e * 18);
        }

        // ===================== VOXEL DATA =====================
        function keyOf(x, y, z) { return x + ',' + y + ',' + z; }
        function baseBlockAt(x, y, z) {
            var h = terrainHeight(x, z);
            if (y > h) return 'empty';
            if (y === h) return 'grass';
            return 'stone'; // no dirt layer underground, just stone
        }
        function blockAt(x, y, z) {
            var k = keyOf(x, y, z);

            return baseBlockAt(x, y, z);

                   !isSolid(x, y + 1, z) || !isSolid(x, y - 1, z) ||
                   !isSolid(x, y, z + 1) || !isSolid(x, y, z - 1);
        }
        function chunkKeyFor(x, z) {
            return Math.floor(x / CHUNK_SIZE) + ',' + Math.floor(z / CHUNK_SIZE);
        }

        // ===================== MODEL LOADING =====================
        function loadTemplate(gltfJson, name, callback) {
            try {
                var loader = new THREE.GLTFLoader();
                loader.parse(JSON.stringify(gltfJson), '', function (gltf) {
                    var found = null;
                    gltf.scene.traverse(function (child) { if (!found && child.isMesh) found = child; });
                    if (!found) { showFatal('No mesh found inside ' + name + ' model.'); callback(null); return; }
                    templates[name] = { geometry: found.geometry, material: found.material };
                    callback(true);
                }, function (err) {
                    showFatal('Failed to parse ' + name + ' model: ' + err);
                    callback(null);
                });
            } catch (e) {
                showFatal('Exception loading ' + name + ' model: ' + e.message);
                callback(null);
            }
        }

        function makeSolidColorTemplate(color) {
            var geometry = new THREE.BoxGeometry(1, 1, 1);
            geometry.translate(0.5, 0.5, 0.5); // span 0..1 to match gltf block convention
            var material = new THREE.MeshPhongMaterial({ color: color });
            return { geometry: geometry, material: material };
        }

        // ===================== CHUNK MESHING =====================
        function buildChunkMeshes(chunk) {
            var types = ['grass', 'stone', 'dirt', 'wood'];
            for (var t = 0; t < types.length; t++) {
                var type = types[t];
                // remove old mesh for this type
                if (chunk.meshes[type]) {
                    scene.remove(chunk.meshes[type]);
                    chunk.meshes[type].geometry.dispose();
                    chunk.meshes[type] = null;
                }
                var positions = [];
                chunk.exposed.forEach(function (blockType, key) {
                    if (blockType === type) positions.push(key);
                });
                if (positions.length === 0) continue;

                var template = templates[type];
                if (!template) continue;

                var geoms = [];
                for (var i = 0; i < positions.length; i++) {
                    var parts = positions[i].split(',');
                    var gx = parseInt(parts[0], 10), gy = parseInt(parts[1], 10), gz = parseInt(parts[2], 10);
                    var g = template.geometry.clone();
                    g.translate(gx, gy, gz);
                    geoms.push(g);
                }
                var merged = THREE.BufferGeometryUtils.mergeBufferGeometries(geoms, false);
                for (var d = 0; d < geoms.length; d++) geoms[d].dispose();

                var mesh = new THREE.Mesh(merged, template.material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                chunk.meshes[type] = mesh;
            }
        }

        function generateChunk(cx, cz) {
            var key = cx + ',' + cz;
            if (chunks.has(key)) return;
            var chunk = { cx: cx, cz: cz, exposed: new Map(), meshes: {} };
            chunks.set(key, chunk);

            var startX = cx * CHUNK_SIZE, startZ = cz * CHUNK_SIZE;
            for (var x = startX; x < startX + CHUNK_SIZE; x++) {
                for (var z = startZ; z < startZ + CHUNK_SIZE; z++) {
                    var h = terrainHeight(x, z);
                    var minNeighborH = Math.min(
                        terrainHeight(x + 1, z), terrainHeight(x - 1, z),
                        terrainHeight(x, z + 1), terrainHeight(x, z - 1),
                        h
                    );
                    for (var y = Math.max(minNeighborH, 0); y <= h; y++) {
                        if (!isSolid(x, y, z)) continue;
                        if (!isExposed(x, y, z)) continue;
                        chunk.exposed.set(keyOf(x, y, z), blockAt(x, y, z));
                    }
                }
            }
            buildChunkMeshes(chunk);
        }

        function unloadChunk(key) {
            var chunk = chunks.get(key);
            if (!chunk) return;
            ['grass', 'stone', 'dirt', 'wood'].forEach(function (type) {
                if (chunk.meshes[type]) {
                    scene.remove(chunk.meshes[type]);
                    chunk.meshes[type].geometry.dispose();
                }
            });
            chunks.delete(key);
        }

        function updateChunksAroundPlayer() {
            var pcx = Math.floor(camera.position.x / CHUNK_SIZE);
            var pcz = Math.floor(camera.position.z / CHUNK_SIZE);
            var currentKey = pcx + ',' + pcz;
            if (currentKey === lastPlayerChunkKey) return;
            lastPlayerChunkKey = currentKey;

            for (var dx = -RENDER_DISTANCE; dx <= RENDER_DISTANCE; dx++) {
                for (var dz = -RENDER_DISTANCE; dz <= RENDER_DISTANCE; dz++) {
                    generateChunk(pcx + dx, pcz + dz);
                }
            }
            var toRemove = [];
            chunks.forEach(function (chunk, key) {
                var dist = Math.max(Math.abs(chunk.cx - pcx), Math.abs(chunk.cz - pcz));
                if (dist > UNLOAD_DISTANCE) toRemove.push(key);
            });
            toRemove.forEach(unloadChunk);

            document.getElementById('chunkPos').textContent = pcx + ',' + pcz;
        }

        // ===================== BLOCK EDITING =====================
        function refreshCell(x, y, z, affectedChunks) {
            var ck = chunkKeyFor(x, z);
            var chunk = chunks.get(ck);
            if (!chunk) return;
            var key = keyOf(x, y, z);
            if (isSolid(x, y, z) && isExposed(x, y, z)) {
                chunk.exposed.set(key, blockAt(x, y, z));
            } else {
                chunk.exposed.delete(key);
            }
            affectedChunks.add(ck);
        }

        function updateBlockAndNeighbors(x, y, z) {
            var affected = new Set();
            refreshCell(x, y, z, affected);
            refreshCell(x + 1, y, z, affected);
            refreshCell(x - 1, y, z, affected);
            refreshCell(x, y + 1, z, affected);
            refreshCell(x, y - 1, z, affected);
            refreshCell(x, y, z + 1, affected);
            refreshCell(x, y, z - 1, affected);
            affected.forEach(function (ck) {
                var chunk = chunks.get(ck);
                if (chunk) buildChunkMeshes(chunk);
            });
        }

        function breakBlock(x, y, z) {
            overrides.set(keyOf(x, y, z), 'empty');
            updateBlockAndNeighbors(x, y, z);
        }

        function placeBlock(x, y, z, type) {
            if (isSolid(x, y, z)) return;
            overrides.set(keyOf(x, y, z), type);
            updateBlockAndNeighbors(x, y, z);
        }

        // ===================== VOXEL RAYCAST (DDA) =====================
        function voxelRaycast(origin, direction, maxDistance) {
            var x = Math.floor(origin.x), y = Math.floor(origin.y), z = Math.floor(origin.z);
            var stepX = direction.x > 0 ? 1 : -1;
            var stepY = direction.y > 0 ? 1 : -1;
            var stepZ = direction.z > 0 ? 1 : -1;
            var tDeltaX = direction.x !== 0 ? Math.abs(1 / direction.x) : Infinity;
            var tDeltaY = direction.y !== 0 ? Math.abs(1 / direction.y) : Infinity;
            var tDeltaZ = direction.z !== 0 ? Math.abs(1 / direction.z) : Infinity;
            function frac(v) { return v - Math.floor(v); }
            var tMaxX = direction.x !== 0 ? (direction.x > 0 ? (1 - frac(origin.x)) : frac(origin.x)) * tDeltaX : Infinity;
            var tMaxY = direction.y !== 0 ? (direction.y > 0 ? (1 - frac(origin.y)) : frac(origin.y)) * tDeltaY : Infinity;
            var tMaxZ = direction.z !== 0 ? (direction.z > 0 ? (1 - frac(origin.z)) : frac(origin.z)) * tDeltaZ : Infinity;

            var normal = { x: 0, y: 0, z: 0 };
            var dist = 0;
            for (var i = 0; i < 200 && dist < maxDistance; i++) {
                if (isSolid(x, y, z)) {
                    return {
                        x: x, y: y, z: z,
                        placeX: x + normal.x, placeY: y + normal.y, placeZ: z + normal.z
                    };
                }
                if (tMaxX < tMaxY && tMaxX < tMaxZ) {
                    x += stepX; dist = tMaxX; tMaxX += tDeltaX; normal = { x: -stepX, y: 0, z: 0 };
                } else if (tMaxY < tMaxZ) {
                    y += stepY; dist = tMaxY; tMaxY += tDeltaY; normal = { x: 0, y: -stepY, z: 0 };
                } else {
                    z += stepZ; dist = tMaxZ; tMaxZ += tDeltaZ; normal = { x: 0, y: 0, z: -stepZ };
                }
            }
            return null;
        }

        // ===================== INIT =====================
        function init() {
            try {
                if (typeof THREE === 'undefined') { showFatal('Three.js failed to load (check internet connection).'); return; }
                if (typeof THREE.GLTFLoader === 'undefined') { showFatal('GLTFLoader failed to load.'); return; }
                if (typeof THREE.BufferGeometryUtils === 'undefined') { showFatal('BufferGeometryUtils failed to load.'); return; }

                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87CEEB);
                scene.fog = new THREE.Fog(0x87CEEB, 120, 300);

                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 70, 0);
                velocity = new THREE.Vector3();

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;
                document.body.appendChild(renderer.domElement);

                var ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);
                var sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
                sunLight.position.set(100, 100, 50);
                sunLight.castShadow = true;
                scene.add(sunLight);

                document.addEventListener('keydown', function (e) { keys[e.key.toLowerCase()] = true; });
                document.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });
                document.addEventListener('mousedown', onMouseDown);
                document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
                window.addEventListener('resize', onWindowResize);
                document.addEventListener('mousemove', onMouseMove);

                document.querySelectorAll('.blockButton').forEach(function (btn) {
                    btn.addEventListener('click', function (e) {
                        document.querySelectorAll('.blockButton').forEach(function (b) { b.classList.remove('active'); });
                        e.currentTarget.classList.add('active');
                        selectedBlock = e.currentTarget.dataset.type;
                    });
                });

                renderer.domElement.addEventListener('click', function () {
                    var el = renderer.domElement;
                    var request = el.requestPointerLock || el.mozRequestPointerLock;
                    if (request) request.call(el);
                });

                templates.dirt = makeSolidColorTemplate(0x8B7355);
                templates.wood = makeSolidColorTemplate(0x8B4513);

                var remaining = 2;
                function onOneLoaded() { remaining--; if (remaining === 0) startWorld(); }
                loadTemplate(GRASS_GLTF, 'grass', onOneLoaded);
                loadTemplate(STONE_GLTF, 'stone', onOneLoaded);
            } catch (e) {
                showFatal('Init failed: ' + e.message);
            }
        }

        function startWorld() {
            document.getElementById('ui').style.display = 'block';
            document.getElementById('controls').style.display = 'block';
            document.getElementById('blockSelector').style.display = 'flex';
            document.getElementById('loading').style.display = 'none';

            // Place player above terrain at spawn
            var spawnH = terrainHeight(0, 0);
            camera.position.set(0.5, spawnH + 3, 0.5);

            updateChunksAroundPlayer();
            animate();
        }

        // ===================== INPUT =====================
        function onMouseMove(e) {
            if (document.pointerLockElement !== renderer.domElement) return;
            var sensitivity = 0.003;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
        }

        function onMouseDown(e) {
            var dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            var hit = voxelRaycast(camera.position, dir, REACH);
            if (!hit) return;

            if (e.button === 0) {
                breakBlock(hit.x, hit.y, hit.z);
            } else if (e.button === 2) {
                placeBlock(hit.placeX, hit.placeY, hit.placeZ, selectedBlock);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ===================== UPDATE LOOP =====================
        function update() {
            var now = Date.now();
            var deltaTime = Math.min((now - lastFrameTime) / 1000, 0.1);
            lastFrameTime = now;

            frameCount++;
            if (frameCount % 30 === 0) {
                document.getElementById('fps').textContent = Math.round(1 / deltaTime);
            }

            var moveForward = 0, moveRight = 0;
            if (keys['w']) moveForward += 1;
            if (keys['s']) moveForward -= 1;
            if (keys['d']) moveRight += 1;
            if (keys['a']) moveRight -= 1;

            var moveSpeed = 0.2;
            if (moveForward !== 0 || moveRight !== 0) {
                var len = Math.sqrt(moveForward * moveForward + moveRight * moveRight);
                moveForward /= len; moveRight /= len;

                var forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                var right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                velocity.x = (forward.x * moveForward + right.x * moveRight) * moveSpeed;
                velocity.z = (forward.z * moveForward + right.z * moveRight) * moveSpeed;
            } else {
                velocity.x *= 0.85;
                velocity.z *= 0.85;
            }

            if (keys[' '] && isGrounded) {
                velocity.y = 0.35;
                isGrounded = false;
            }

            velocity.y -= 0.02;
            velocity.y = Math.max(velocity.y, -0.6);

            // Move with simple axis-separated collision
            var pos = camera.position;
            var eyeToFeet = 1.6;

            // X axis
            var nx = pos.x + velocity.x;
            if (!isSolid(Math.floor(nx), Math.floor(pos.y - eyeToFeet), Math.floor(pos.z)) &&
                !isSolid(Math.floor(nx), Math.floor(pos.y - eyeToFeet + 1), Math.floor(pos.z))) {
                pos.x = nx;
            } else {
                velocity.x = 0;
            }

            // Z axis
            var nz = pos.z + velocity.z;
            if (!isSolid(Math.floor(pos.x), Math.floor(pos.y - eyeToFeet), Math.floor(nz)) &&
                !isSolid(Math.floor(pos.x), Math.floor(pos.y - eyeToFeet + 1), Math.floor(nz))) {
                pos.z = nz;
            } else {
                velocity.z = 0;
            }

            // Y axis
            var ny = pos.y + velocity.y;
            var feetY = Math.floor(ny - eyeToFeet);
            if (velocity.y <= 0 && isSolid(Math.floor(pos.x), feetY, Math.floor(pos.z))) {
                isGrounded = true;
                velocity.y = 0;
                pos.y = feetY + 1 + eyeToFeet;
            } else if (velocity.y > 0 && isSolid(Math.floor(pos.x), Math.floor(ny - eyeToFeet + 2), Math.floor(pos.z))) {
                velocity.y = 0;
                pos.y = ny;
            } else {
                pos.y = ny;
                isGrounded = false;
            }

            document.getElementById('posX').textContent = Math.round(pos.x);
            document.getElementById('posY').textContent = Math.round(pos.y);
            document.getElementById('posZ').textContent = Math.round(pos.z);

            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            updateChunksAroundPlayer();
        }

        function animate() {
            requestAnimationFrame(animate);
            try {
                update();
                renderer.render(scene, camera);
            } catch (e) {
                showFatal('Runtime error: ' + e.message);
            }
        }

        window.addEventListener('load', init);
        setTimeout(function () { if (!scene) init(); }, 2000);
    })();
    </script>
</body>
</html>
