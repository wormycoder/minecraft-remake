<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 4px;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
        }

        #crosshair svg {
            width: 100%;
            height: 100%;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #aaa;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 4px;
        }

        #blockSelector {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .blockButton {
            width: 50px;
            height: 50px;
            border: 2px solid #555;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .blockButton:hover {
            border-color: #fff;
        }

        .blockButton.active {
            border-color: #0f0;
            box-shadow: 0 0 10px #0f0;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Three.js...</div>
    <div id="crosshair">
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="1" fill="white" opacity="0.7"/>
            <line x1="10" y1="4" x2="10" y2="6" stroke="white" stroke-width="0.5" opacity="0.7"/>
            <line x1="10" y1="14" x2="10" y2="16" stroke="white" stroke-width="0.5" opacity="0.7"/>
            <line x1="4" y1="10" x2="6" y2="10" stroke="white" stroke-width="0.5" opacity="0.7"/>
            <line x1="14" y1="10" x2="16" y2="10" stroke="white" stroke-width="0.5" opacity="0.7"/>
        </svg>
    </div>
    <div id="ui" style="display:none;">
        <div>X: <span id="posX">0</span></div>
        <div>Y: <span id="posY">0</span></div>
        <div>Z: <span id="posZ">0</span></div>
        <div>FPS: <span id="fps">0</span></div>
    </div>
    <div id="controls" style="display:none;">
        <div><strong>WASD</strong> - Move</div>
        <div><strong>Space</strong> - Jump</div>
        <div><strong>Click</strong> - Break Block</div>
        <div><strong>Right Click</strong> - Place Block</div>
    </div>
    <div id="blockSelector" style="display:none;">
        <button class="blockButton active" data-type="grass" style="background-color: #7EC850;" title="Grass"></button>
        <button class="blockButton" data-type="dirt" style="background-color: #8B7355;" title="Dirt"></button>
        <button class="blockButton" data-type="stone" style="background-color: #888;" title="Stone"></button>
        <button class="blockButton" data-type="wood" style="background-color: #8B4513;" title="Wood"></button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, controls;
        let blocks = new Map();
        let selectedBlock = 'grass';
        let keys = {};
        
        const BLOCK_SIZE = 1;
        const COLORS = {
            grass: 0x7EC850,
            dirt: 0x8B7355,
            stone: 0x888888,
            wood: 0x8B4513
        };

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 200, 500);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 70, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(100, 100, 50);
            sunLight.castShadow = true;
            sunLight.shadow.camera.left = -300;
            sunLight.shadow.camera.right = 300;
            sunLight.shadow.camera.top = 300;
            sunLight.shadow.camera.bottom = -300;
            scene.add(sunLight);

            // Events
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('contextmenu', (e) => e.preventDefault());
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onMouseMove);

            // Block selector
            document.querySelectorAll('.blockButton').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.blockButton').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    selectedBlock = e.target.dataset.type;
                });
            });

            // Show UI
            document.getElementById('ui').style.display = 'block';
            document.getElementById('controls').style.display = 'block';
            document.getElementById('blockSelector').style.display = 'flex';
            document.getElementById('loading').style.display = 'none';

            // Lock pointer on click (moved here so renderer exists first)
            renderer.domElement.addEventListener('click', () => {
                renderer.domElement.requestPointerLock = 
                    renderer.domElement.requestPointerLock || 
                    renderer.domElement.mozRequestPointerLock;
                renderer.domElement.requestPointerLock();
            });

            generateTerrain();
            animate();
        }

        function generateTerrain() {
            const range = 40;
            
            for (let x = -range; x < range; x += 2) {
                for (let z = -range; z < range; z += 2) {
                    const height = Math.floor(
                        Math.sin(x * 0.05) * 10 + 
                        Math.cos(z * 0.05) * 10 + 
                        Math.sin(x * 0.02 + z * 0.02) * 5 + 
                        50
                    );

                    for (let y = 0; y <= height; y++) {
                        let blockType = 'stone';
                        if (y === height) blockType = 'grass';
                        else if (y > height - 3) blockType = 'dirt';
                        
                        addBlock(x, y, z, blockType);
                    }
                }
            }
        }

        function addBlock(x, y, z, type) {
            const key = `${x},${y},${z}`;
            if (blocks.has(key)) return;

            const geometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            const material = new THREE.MeshPhongMaterial({ color: COLORS[type] });
            const mesh = new THREE.Mesh(geometry, material);
            
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            scene.add(mesh);
            blocks.set(key, { mesh, type, x, y, z });
        }

        function removeBlock(x, y, z) {
            const key = `${x},${y},${z}`;
            const block = blocks.get(key);
            if (block) {
                scene.remove(block.mesh);
                blocks.delete(key);
            }
        }

        function raycast() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            const meshes = Array.from(blocks.values()).map(b => b.mesh);
            const intersects = raycaster.intersectObjects(meshes);
            
            return intersects.length > 0 ? intersects[0] : null;
        }

        let velocity = new THREE.Vector3();
        let isGrounded = false;
        let yaw = 0, pitch = 0;
        let lastFrameTime = Date.now();
        let frameCount = 0;

        function update() {
            const now = Date.now();
            const deltaTime = Math.min((now - lastFrameTime) / 1000, 0.1);
            lastFrameTime = now;

            frameCount++;
            if (frameCount % 30 === 0) {
                document.getElementById('fps').textContent = Math.round(1 / deltaTime);
            }

            // Movement
            const moveDir = new THREE.Vector3();
            const moveSpeed = 0.2;

            if (keys['w'] || keys['W']) moveDir.z -= 1;
            if (keys['s'] || keys['S']) moveDir.z += 1;
            if (keys['a'] || keys['A']) moveDir.x -= 1;
            if (keys['d'] || keys['D']) moveDir.x += 1;

            if (moveDir.length() > 0) {
                moveDir.normalize();
                
                const forward = new THREE.Vector3(0, 0, -1)
                    .applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const right = new THREE.Vector3(1, 0, 0)
                    .applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                velocity.x = (forward.x * moveDir.z + right.x * moveDir.x) * moveSpeed;
                velocity.z = (forward.z * moveDir.z + right.z * moveDir.x) * moveSpeed;
            } else {
                velocity.x *= 0.85;
                velocity.z *= 0.85;
            }

            // Jumping
            if ((keys[' '] || keys['Spacebar']) && isGrounded) {
                velocity.y = 0.35;
                isGrounded = false;
            }

            // Gravity
            velocity.y -= 0.02;
            velocity.y = Math.max(velocity.y, -0.5);

            // Apply velocity
            camera.position.add(velocity);

            // Ground collision
            const playerY = camera.position.y - 1.6; // Eye height
            const blockKey = `${Math.round(camera.position.x)},${Math.floor(playerY)},${Math.round(camera.position.z)}`;
            
            isGrounded = blocks.has(blockKey);
            
            if (isGrounded) {
                const block = blocks.get(blockKey);
                velocity.y = 0;
                camera.position.y = Math.max(camera.position.y, block.y + 2.6);
            }

            // Update UI
            document.getElementById('posX').textContent = Math.round(camera.position.x);
            document.getElementById('posY').textContent = Math.round(camera.position.y);
            document.getElementById('posZ').textContent = Math.round(camera.position.z);

            // Update camera rotation
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        function onKeyDown(e) {
            keys[e.key] = true;
        }

        function onKeyUp(e) {
            keys[e.key] = false;
        }

        function onMouseMove(e) {
            if (document.pointerLockElement !== renderer.domElement) return;

            const sensitivity = 0.003;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
        }

        function onMouseDown(e) {
            const intersection = raycast();
            if (!intersection) return;

            const pos = intersection.object.position;
            const x = pos.x;
            const y = pos.y;
            const z = pos.z;

            if (e.button === 0) {
                // Left click - break
                removeBlock(x, y, z);
            } else if (e.button === 2) {
                // Right click - place
                const normal = intersection.face.normal;
                const newX = Math.round(intersection.point.x + normal.x * 0.5);
                const newY = Math.round(intersection.point.y + normal.y * 0.5);
                const newZ = Math.round(intersection.point.z + normal.z * 0.5);
                addBlock(newX, newY, newZ, selectedBlock);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        // Start when page loads
        window.addEventListener('load', init);

        // Fallback init
        setTimeout(() => {
            if (!scene) init();
        }, 2000);
    </script>
</body>
</html>
