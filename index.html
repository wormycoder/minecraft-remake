<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 20px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            z-index: 5;
            pointer-events: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
        }

        #crosshair::before {
            width: 2px;
            height: 6px;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
        }

        #crosshair::after {
            width: 2px;
            height: 6px;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #aaa;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 20px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            max-width: 250px;
        }

        #controls div {
            margin: 5px 0;
        }

        #blockSelector {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .blockButton {
            width: 50px;
            height: 50px;
            border: 2px solid #555;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            background-size: 100%;
        }

        .blockButton:hover {
            border-color: #fff;
            transform: scale(1.1);
        }

        .blockButton.active {
            border-color: #0f0;
            box-shadow: 0 0 10px #0f0;
        }

        .blockButton[data-type="dirt"] {
            background-color: #8B7355;
        }

        .blockButton[data-type="grass"] {
            background-color: #7EC850;
        }

        .blockButton[data-type="stone"] {
            background-color: #888;
        }

        .blockButton[data-type="wood"] {
            background-color: #8B4513;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">
        <div>Position: <span id="pos">0, 0, 0</span></div>
        <div>Selected: <span id="selected">Grass</span></div>
        <div>FPS: <span id="fps">60</span></div>
    </div>
    <div id="controls">
        <div><strong>WASD</strong> - Move</div>
        <div><strong>Space</strong> - Jump</div>
        <div><strong>Shift</strong> - Sprint</div>
        <div><strong>Click</strong> - Break/Place</div>
        <div><strong>1-4</strong> - Select Block</div>
        <div><strong>Mouse</strong> - Look</div>
    </div>
    <div id="blockSelector">
        <button class="blockButton active" data-type="grass" title="Grass"></button>
        <button class="blockButton" data-type="dirt" title="Dirt"></button>
        <button class="blockButton" data-type="stone" title="Stone"></button>
        <button class="blockButton" data-type="wood" title="Wood"></button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game state
        const gameState = {
            selectedBlock: 'grass',
            blocks: new Map(),
            camera: null,
            scene: null,
            renderer: null,
            velocity: { x: 0, y: 0, z: 0 },
            isGrounded: false,
            keys: {},
            fpsCounter: { frames: 0, lastTime: Date.now(), fps: 60 }
        };

        // Initialize scene
        function init() {
            // Scene setup
            gameState.scene = new THREE.Scene();
            gameState.scene.background = new THREE.Color(0x87CEEB);
            gameState.scene.fog = new THREE.Fog(0x87CEEB, 200, 500);

            // Camera
            gameState.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            gameState.camera.position.set(0, 65, 0);

            // Renderer
            gameState.renderer = new THREE.WebGLRenderer({ antialias: true });
            gameState.renderer.setSize(window.innerWidth, window.innerHeight);
            gameState.renderer.shadowMap.enabled = true;
            document.body.appendChild(gameState.renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            gameState.scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(100, 100, 100);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.left = -300;
            directionalLight.shadow.camera.right = 300;
            directionalLight.shadow.camera.top = 300;
            directionalLight.shadow.camera.bottom = -300;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            gameState.scene.add(directionalLight);

            // Generate initial terrain
            generateTerrain();

            // Event listeners
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('click', onMouseClick);
            window.addEventListener('resize', onWindowResize);
            
            // Block selector
            document.querySelectorAll('.blockButton').forEach(btn => {
                btn.addEventListener('click', (e) => selectBlock(e.target.dataset.type));
            });

            // Lock pointer on click
            gameState.renderer.domElement.addEventListener('click', () => {
                gameState.renderer.domElement.requestPointerLock?.();
            });

            // Mouse move for camera
            document.addEventListener('mousemove', onMouseMove);

            // Start animation loop
            animate();
        }

        // Perlin-like noise for terrain generation (simplified)
        function getTerrainHeight(x, z) {
            const scale1 = 0.01;
            const scale2 = 0.05;
            const n1 = Math.sin(x * scale1 + z * scale1) * Math.cos(x * scale1 * 0.5);
            const n2 = Math.sin(x * scale2) * Math.cos(z * scale2);
            return Math.floor((n1 + n2) * 30 + 64);
        }

        // Generate terrain chunks
        function generateTerrain() {
            const chunkSize = 16;
            const renderDistance = 3;

            for (let cx = -renderDistance; cx <= renderDistance; cx++) {
                for (let cz = -renderDistance; cz <= renderDistance; cz++) {
                    const startX = cx * chunkSize;
                    const startZ = cz * chunkSize;

                    for (let x = startX; x < startX + chunkSize; x++) {
                        for (let z = startZ; z < startZ + chunkSize; z++) {
                            const height = getTerrainHeight(x, z);
                            
                            // Place blocks from bedrock to surface
                            for (let y = 0; y <= height; y++) {
                                let blockType = 'stone';
                                if (y === height) blockType = 'grass';
                                else if (y > height - 4) blockType = 'dirt';
                                
                                addBlockToScene(x, y, z, blockType);
                            }
                        }
                    }
                }
            }
        }

        // Add block to scene
        function addBlockToScene(x, y, z, type) {
            const key = `${x},${y},${z}`;
            
            if (gameState.blocks.has(key)) return;

            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const colors = {
                grass: 0x7EC850,
                dirt: 0x8B7355,
                stone: 0x888888,
                wood: 0x8B4513
            };
            
            const material = new THREE.MeshLambertMaterial({ color: colors[type] });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            gameState.scene.add(mesh);
            gameState.blocks.set(key, { mesh, type, x, y, z });
        }

        // Remove block
        function removeBlock(x, y, z) {
            const key = `${x},${y},${z}`;
            if (gameState.blocks.has(key)) {
                const { mesh } = gameState.blocks.get(key);
                gameState.scene.remove(mesh);
                gameState.blocks.delete(key);
            }
        }

        // Raycasting for block selection
        function getRaycastTarget() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), gameState.camera);
            
            const blockMeshes = Array.from(gameState.blocks.values()).map(b => b.mesh);
            const intersects = raycaster.intersectObjects(blockMeshes);
            
            if (intersects.length > 0) {
                return intersects[0];
            }
            return null;
        }

        // Mouse click handler
        function onMouseClick(event) {
            if (event.button === 0) {
                // Left click - break block
                const intersection = getRaycastTarget();
                if (intersection) {
                    const pos = intersection.object.position;
                    removeBlock(pos.x, pos.y, pos.z);
                }
            } else if (event.button === 2) {
                // Right click - place block
                const intersection = getRaycastTarget();
                if (intersection) {
                    const pos = intersection.point;
                    const normal = intersection.face.normal;
                    const newPos = {
                        x: Math.round(pos.x + normal.x * 0.5),
                        y: Math.round(pos.y + normal.y * 0.5),
                        z: Math.round(pos.z + normal.z * 0.5)
                    };
                    addBlockToScene(newPos.x, newPos.y, newPos.z, gameState.selectedBlock);
                }
            }
        }

        // Keyboard handlers
        function onKeyDown(e) {
            gameState.keys[e.key.toLowerCase()] = true;
            
            // Block selection with number keys
            const blockMap = { '1': 'grass', '2': 'dirt', '3': 'stone', '4': 'wood' };
            if (blockMap[e.key]) {
                selectBlock(blockMap[e.key]);
            }
        }

        function onKeyUp(e) {
            gameState.keys[e.key.toLowerCase()] = false;
        }

        function selectBlock(type) {
            gameState.selectedBlock = type;
            document.querySelectorAll('.blockButton').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
            document.getElementById('selected').textContent = type.charAt(0).toUpperCase() + type.slice(1);
        }

        // Mouse movement
        let pitch = 0, yaw = 0;
        function onMouseMove(event) {
            if (document.pointerLockElement !== gameState.renderer.domElement) return;
            
            const sensitivity = 0.003;
            yaw -= event.movementX * sensitivity;
            pitch -= event.movementY * sensitivity;
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
            
            gameState.camera.rotation.order = 'YXZ';
            gameState.camera.rotation.y = yaw;
            gameState.camera.rotation.x = pitch;
        }

        // Window resize
        function onWindowResize() {
            gameState.camera.aspect = window.innerWidth / window.innerHeight;
            gameState.camera.updateProjectionMatrix();
            gameState.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Physics & movement
        function updatePlayer() {
            const speed = gameState.keys['shift'] ? 0.3 : 0.15;
            const direction = new THREE.Vector3();
            
            if (gameState.keys['w']) direction.z -= 1;
            if (gameState.keys['s']) direction.z += 1;
            if (gameState.keys['a']) direction.x -= 1;
            if (gameState.keys['d']) direction.x += 1;
            
            if (direction.length() > 0) {
                direction.normalize();
                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                
                gameState.velocity.x = (forward.x * direction.z + right.x * direction.x) * speed;
                gameState.velocity.z = (forward.z * direction.z + right.z * direction.x) * speed;
            } else {
                gameState.velocity.x *= 0.9;
                gameState.velocity.z *= 0.9;
            }
            
            // Jumping
            if (gameState.keys[' '] && gameState.isGrounded) {
                gameState.velocity.y = 0.3;
                gameState.isGrounded = false;
            }
            
            // Gravity
            gameState.velocity.y -= 0.015;
            gameState.velocity.y = Math.max(gameState.velocity.y, -0.5);
            
            // Update position
            gameState.camera.position.x += gameState.velocity.x;
            gameState.camera.position.y += gameState.velocity.y;
            gameState.camera.position.z += gameState.velocity.z;
            
            // Ground collision
            const pos = gameState.camera.position;
            const blockBelow = gameState.blocks.get(`${Math.round(pos.x)},${Math.floor(pos.y - 1.5)},${Math.round(pos.z)}`);
            
            gameState.isGrounded = !!blockBelow;
            if (blockBelow) {
                gameState.velocity.y = 0;
                gameState.camera.position.y = Math.max(pos.y, Math.floor(pos.y - 1.5) + 2);
            }
            
            // Update UI
            document.getElementById('pos').textContent = 
                `${Math.round(pos.x)}, ${Math.round(pos.y)}, ${Math.round(pos.z)}`;
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            updatePlayer();
            gameState.renderer.render(gameState.scene, gameState.camera);
            
            // FPS counter
            gameState.fpsCounter.frames++;
            const now = Date.now();
            if (now - gameState.fpsCounter.lastTime > 1000) {
                gameState.fpsCounter.fps = gameState.fpsCounter.frames;
                gameState.fpsCounter.frames = 0;
                gameState.fpsCounter.lastTime = now;
                document.getElementById('fps').textContent = gameState.fpsCounter.fps;
            }
        }

        // Prevent context menu on right click
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Initialize game
        init();
    </script>
</body>
</html>
